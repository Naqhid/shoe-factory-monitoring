<!DOCTYPE html>
<html>
<head>
    <title>Florence IOT - Demo QR Codes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .qr-section { margin-bottom: 40px; border-bottom: 1px solid #ccc; padding-bottom: 20px; }
        .qr-container { display: inline-block; margin: 20px; vertical-align: top; border: 1px solid #eee; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .qr-code { margin: 10px auto; }
        h1 { color: #111827; }
        h2 { color: #374151; margin-bottom: 20px; }
        .label { font-weight: bold; margin-top: 10px; color: #2563eb; }
        .sub { font-size: 0.8em; color: #6b7280; margin-top: 5px; max-width: 150px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Demo QR Codes</h1>
    <p>Scan these codes with the <b>Line Setup Form</b> to test the flow.</p>

    <div class="qr-section">
        <h2>1. Step 1: Scan Employee</h2>
        <div id="emp1" class="qr-container"></div>
        <div id="emp2" class="qr-container"></div>
        <div id="emp3" class="qr-container"></div>
    </div>

    <div class="qr-section">
        <h2>2. Step 2: Scan Machine</h2>
        <div id="mac1" class="qr-container"></div>
        <div id="mac2" class="qr-container"></div>
        <div id="mac3" class="qr-container"></div>
    </div>
    
    <div class="qr-section">
        <h2>3. Optional: Scan Remote Session</h2>
        <p>If connecting to a remote display, scan the QR on that display (e.g. <code>/mobile</code>).</p>
        <p>Or use this Demo Session ID to simulate:</p>
        <div id="session1" class="qr-container"></div>
    </div>

    <script>
        function createQR(id, text, label) {
            const container = document.getElementById(id);
            if(!container) return;
            
            const qrDiv = document.createElement('div');
            qrDiv.className = 'qr-code';
            // Clear previous
            container.innerHTML = '';
            
            new QRCode(qrDiv, { text: text, width: 150, height: 150 });
            
            const labelDiv = document.createElement('div');
            labelDiv.className = 'label';
            labelDiv.innerText = label;
            
            const subDiv = document.createElement('div');
            subDiv.className = 'sub';
            subDiv.innerText = text.length > 30 ? 'JSON Data' : text;

            container.appendChild(qrDiv);
            container.appendChild(labelDiv);
            container.appendChild(subDiv);
        }

        // Employees (JSON) - ID and Name are the critical fields
        createQR('emp1', JSON.stringify({id: 'EMP-1001', name: 'John Doe'}), 'John Doe (EMP-1001)');
        createQR('emp2', JSON.stringify({id: 'EMP-1002', name: 'Jane Smith'}), 'Jane Smith (EMP-1002)');
        createQR('emp3', JSON.stringify({id: 'EMP-1003', name: 'Bob Operator'}), 'Bob Operator (EMP-1003)');

        // Machines (Text) - Should match database codes
        createQR('mac1', 'MAC-001', 'Stitching 1 (MAC-001)');
        createQR('mac2', 'MAC-002', 'Stitching 2 (MAC-002)');
        createQR('mac3', 'MAC-003', 'Stitching 3 (MAC-003)');
        
        // Demo Session
        createQR('session1', 'DEMO-SESSION', 'Test Session (DEMO)');
    </script>
</body>
</html>
